<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pathfinding Playground</title>
<style>body{font:17px system-ui;background:#0d1725;color:#edf3ff;max-width:1050px;margin:40px auto;padding:20px}h1{font-size:clamp(32px,6vw,56px)}button,select{font:inherit;padding:10px;margin:6px;border-radius:6px;border:0;background:#294465;color:white}button{cursor:pointer;background:#0f766e}canvas{width:100%;background:#17273c;touch-action:none;border-radius:10px}label{white-space:nowrap}#status{min-height:50px}small{color:#9eb8d8}</style>
<small>ALGORITHM LAB · FOUR-WAY GRID</small><h1>Find another way.</h1><p>Paint walls or weighted terrain, move the endpoints, then compare how three algorithms explore.</p>
<label>Brush <select id="brush"><option value="0">Wall</option><option value="1">Clear</option><option value="5">Mud (cost 5)</option><option value="start">Start</option><option value="goal">Goal</option></select></label>
<label>Algorithm <select id="algorithm"><option value="bfs">Breadth-first</option><option value="dijkstra">Dijkstra</option><option value="astar">A*</option></select></label><button id="run">Explore</button><button id="clear">Reset</button><button id="save">Save map</button><button id="load">Load map</button>
<p>Green = start · pink = goal · brown = mud · blue = explored · yellow = route</p><canvas id="grid" width="1000" height="600" aria-label="Editable pathfinding map"></canvas><p id="status" role="status">Draw on the grid to start.</p>
<script type="module">
import{search}from'/pathfinding.js';const el=id=>document.getElementById(id),canvas=el('grid'),ctx=canvas.getContext('2d');let grid,start,goal,busy=false,painting=false;
function reset(){grid=Array.from({length:18},()=>Array(30).fill(1));start=[2,9];goal=[27,9];draw();}
function draw(visited=[],path=[]){const v=new Set(visited.map(p=>p.join(','))),r=new Set(path.map(p=>p.join(',')));for(let y=0;y<18;y++)for(let x=0;x<30;x++){const k=[x,y].join(',');ctx.fillStyle=k===start.join(',')?'#34d399':k===goal.join(',')?'#f472b6':r.has(k)?'#facc15':v.has(k)?'#4685c8':grid[y][x]===0?'#050a11':grid[y][x]===5?'#956139':'#1f354e';ctx.fillRect(x*1000/30+1,y*600/18+1,1000/30-2,600/18-2);}}
function paint(e){if(busy)return;const b=canvas.getBoundingClientRect(),x=Math.min(29,Math.max(0,Math.floor((e.clientX-b.left)/b.width*30))),y=Math.min(17,Math.max(0,Math.floor((e.clientY-b.top)/b.height*18)));const brush=el('brush').value;if(brush==='start'){start=[x,y];grid[y][x]=1;}else if(brush==='goal'){goal=[x,y];grid[y][x]=1;}else if([x,y].join(',')!==start.join(',')&&[x,y].join(',')!==goal.join(','))grid[y][x]=+brush;draw();}
canvas.onpointerdown=e=>{painting=true;canvas.setPointerCapture(e.pointerId);paint(e);};canvas.onpointermove=e=>{if(painting)paint(e);};canvas.onpointerup=canvas.onpointercancel=()=>painting=false;
el('run').onclick=async()=>{if(busy)return;busy=true;const result=search(grid,start,goal,el('algorithm').value);for(let i=0;i<=result.visited.length;i+=10){draw(result.visited.slice(0,i));await new Promise(r=>setTimeout(r,12));}draw(result.visited,result.path);el('status').textContent=result.path.length?`Visited ${result.visited.length} cells · ${result.path.length-1} moves · algorithm cost ${result.cost}${el('algorithm').value==='bfs'?' (BFS ignores terrain weights)':''}`:`No route. Explored ${result.visited.length} cells.`;busy=false;};
el('clear').onclick=()=>{if(!busy)reset();};el('save').onclick=()=>{try{localStorage.setItem('pathfinding-map',JSON.stringify({grid,start,goal}));el('status').textContent='Map saved in this browser.';}catch(e){el('status').textContent=e.message;}};el('load').onclick=()=>{if(busy)return;try{const data=JSON.parse(localStorage.getItem('pathfinding-map')??'null');if(!data||data.grid.length!==18||data.grid.some(r=>r.length!==30||r.some(v=>![0,1,5].includes(v))))throw Error('No valid saved map.');search(data.grid,data.start,data.goal,'astar');({grid,start,goal}=data);draw();}catch(e){el('status').textContent=e.message;}};reset();
</script></html>
